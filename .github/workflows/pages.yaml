# Build the frontend as a static site and publish it to GitHub Pages at
# https://kieranwood.ca/planee (see DEPLOYMENT.md > GitHub Pages).
#
# Only the frontend ships here; there is no sync backend on Pages, so the build
# sets PUBLIC_DEFAULT_SYNC_MODE=offline and the app starts in offline mode until
# the user points Settings at a self-hosted (https) server.
#
# One-time repo setting: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".
#
# The test job runs the fast gates only (type check + unit tests). The
# Playwright multi-device sync harness runs in sync-tests.yml instead.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

# GITHUB_TOKEN scopes needed to publish a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is already publishing.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BUILD_PATH: "./frontend"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ env.BUILD_PATH }}/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.BUILD_PATH }}
      - name: Type check (astro check + svelte-check)
        run: npm run check
        working-directory: ${{ env.BUILD_PATH }}
      - name: Unit tests
        run: npm run test:unit
        working-directory: ${{ env.BUILD_PATH }}

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ env.BUILD_PATH }}/package-lock.json
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.BUILD_PATH }}
      - name: Build with Astro
        run: |
          npx --no-install astro build \
            --site "https://kieranwood.ca" \
            --base "/planee"
        working-directory: ${{ env.BUILD_PATH }}
        env:
          # Same-origin on Pages is a static host with no /sync endpoints.
          PUBLIC_DEFAULT_SYNC_MODE: offline
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.BUILD_PATH }}/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
